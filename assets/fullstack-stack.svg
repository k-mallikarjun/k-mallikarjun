<rect width="1200" height="380" rx="18" fill="url(#bg)"/><rect width="1200" height="380" rx="18" fill="url(#grid)"/>
<rect x="2" y="2" width="1196" height="376" rx="17" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
