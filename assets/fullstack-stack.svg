S/SNS | Flink</text><rect x="40" y="240" width="210" height="60" rx="12" fill="#0b0b22" stroke="#00f0ff" stroke-width="1.6" /><text x="145.0" y="267.0" text-anchor="middle" class="bt">CI/CD</text><text x="145.0" y="289.0" text-anchor="middle" class="bs">GitHub Actions | Jenkins | GitLab</text><rect x="290" y="240" width="230" height="60" rx="12" fill="#0b0b22" stroke="#00f0ff" stroke-width="1.6" /><text x="405.0" y="267.0" text-anchor="middle" class="bt">Containers</text><text x="405.0" y="289.0" text-anchor="middle" class="bs">Docker | Kubernetes | Helm</text><rect x="560" y="240" width="230" height="60" rx="12" fill="#0b0b22" stroke="#00f0ff" stroke-width="1.6" /><text x="675.0" y="267.0" text-anchor="middle" class="bt">Cloud</text><text x="675.0" y="289.0" text-anchor="middle" class="bs">AWS | Azure | GCP | Terraform</text><rect x="830" y="240" width="330" height="60" rx="12" fill="#0b0b22" stroke="#00f0ff" stroke-width="1.6" /><text x="995.0" y="267.0" text-anchor="middle" class="bt">Data Stores</text><text x="995.0" y="289.0" text-anchor="middle" class="bs">PostgreSQL | Oracle | MongoDB | Redis</text><circle r="4.5" fill="#ff2bd6" filter="url(#glow)"><animateMotion dur="2.00s" repeatCount="indefinite"><mpath href="#q1"/></animateMotion></circle><circle r="4.5" fill="#ff2bd6" filter="url(#glow)"><animateMotion dur="2.15s" repeatCount="indefinite"><mpath href="#q2"/></animateMotion></circle><circle r="4.5" fill="#ff2bd6" filter="url(#glow)"><animateMotion dur="2.30s" repeatCount="indefinite"><mpath href="#q3"/></animateMotion></circle><circle r="4.5" fill="#ff2bd6" filter="url(#glow)"><animateMotion dur="2.45s" repeatCount="indefinite"><mpath href="#q4"/></animateMotion></circle><circle r="4.5" fill="#ff2bd6" filter="url(#glow)"><animateMotion dur="2.60s" repeatCount="indefinite"><mpath href="#q5"/></animateMotion></circle><circle r="4.5" fill="#ff2bd6" filter="url(#glow)"><animateMotion dur="2.75s" repeatCount="indefinite"><mpath href="#q6"/></animateMotion></circle><circle r="4.5" fill="#ff2bd6" filter="url(#glow)"><animateMotion dur="2.90s" repeatCount="indefinite"><mpath href="#q7"/></animateMotion></circle>
